<template>
    <section
        class="raa-modal-backdrop"
        role="dialog"
        aria-modal="true"
        aria-labelledby="raa-reason-modal-heading"
        onclick={handleClose}
    >
        <div class="slds-modal slds-fade-in-open slds-modal_medium raa-modal" onclick={handleStopPropagation}>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleClose}
                    >
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="raa-reason-modal-heading" class="slds-text-heading_medium">
                        Access reasons for {userName}
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">{username}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:false={hasReasons}>
                        <div class="slds-illustration slds-illustration_small">
                            <p class="slds-text-body_regular">No detected reasons are available for this user.</p>
                        </div>
                    </template>
                    <template if:true={hasReasons}>
                        <template for:each={decoratedReasons} for:item="reason">
                            <article key={reason.key} class="slds-box slds-box_x-small slds-m-bottom_small raa-reason-card">
                                <div class="slds-grid slds-wrap slds-grid_align-spread">
                                    <div class="slds-col">
                                        <span class="slds-text-heading_small">{reason.category}</span>
                                        <lightning-badge label={reason.directLabel} class="slds-m-left_x-small"></lightning-badge>
                                    </div>
                                    <div class="slds-col">
                                        <lightning-badge
                                            label={reason.confidence}
                                            class={reason.confidenceVariant}
                                        ></lightning-badge>
                                    </div>
                                </div>
                                <dl class="slds-list_horizontal slds-wrap slds-m-top_x-small">
                                    <dt class="slds-item_label slds-text-color_weak raa-dt">Access level</dt>
                                    <dd class="slds-item_detail raa-dd">{reason.accessLevel}</dd>
                                    <dt class="slds-item_label slds-text-color_weak raa-dt">Source</dt>
                                    <dd class="slds-item_detail raa-dd">{reason.sourceName}</dd>
                                    <dt class="slds-item_label slds-text-color_weak raa-dt">Row cause</dt>
                                    <dd class="slds-item_detail raa-dd">{reason.rowCause}</dd>
                                </dl>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Grant path</p>
                                <div class="raa-path-flow" role="list" aria-label="Grant path">
                                    <template for:each={reason.pathSteps} for:item="step">
                                        <span key={step.key} class="raa-path-step-wrapper" role="listitem">
                                            <span class="raa-path-chip">{step.label}</span>
                                            <lightning-icon
                                                icon-name="utility:forward"
                                                size="xx-small"
                                                class="raa-path-arrow"
                                            ></lightning-icon>
                                        </span>
                                    </template>
                                </div>
                                <p class="slds-text-body_regular slds-m-top_x-small">{reason.explanation}</p>
                                <template if:true={reason.hasEvidence}>
                                    <details class="slds-m-top_x-small">
                                        <summary class="slds-text-body_small slds-text-color_weak">Evidence</summary>
                                        <p class="slds-text-body_small raa-evidence">{reason.evidence}</p>
                                    </details>
                                </template>
                            </article>
                        </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={handleClose}>Close</button>
                </footer>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </section>
</template>
