<template>
    <section
        class="raa-modal-backdrop"
        role="dialog"
        aria-modal="true"
        aria-labelledby="raa-plain-english-summary-heading"
        onclick={handleClose}
    >
        <div
            class="slds-modal slds-fade-in-open slds-modal_medium raa-modal"
            onclick={handleStopPropagation}
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleClose}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            size="small"
                            variant="inverse"
                        ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2
                        id="raa-plain-english-summary-heading"
                        class="slds-text-heading_medium"
                    >
                        Plain-English summary
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">
                        {recordDisplayName}
                    </p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner
                            alternative-text="Loading"
                            size="medium"
                        ></lightning-spinner>
                    </template>
                    <template if:true={errorMessage}>
                        <div
                            class="slds-notify slds-notify_alert slds-theme_error"
                            role="alert"
                        >
                            {errorMessage}
                        </div>
                    </template>
                    <template if:true={summary}>
                        <p class="slds-text-body_regular">{summary}</p>
                        <p
                            class="slds-text-body_small slds-text-color_weak slds-m-top_medium"
                        >
                            Generated deterministically from this scan's own
                            results - not an AI-generated summary.
                        </p>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button
                        class="slds-button slds-button_brand"
                        onclick={handleClose}
                    >
                        Close
                    </button>
                </footer>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </section>
</template>
