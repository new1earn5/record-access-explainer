<template>
    <section
        class="raa-modal-backdrop"
        role="dialog"
        aria-modal="true"
        aria-labelledby="raa-field-access-heading"
        onclick={handleClose}
    >
        <div
            class="slds-modal slds-fade-in-open slds-modal_medium raa-modal"
            onclick={handleStopPropagation}
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleClose}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            size="small"
                            variant="inverse"
                        ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2
                        id="raa-field-access-heading"
                        class="slds-text-heading_medium"
                    >
                        Field access for {userName}
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">
                        {objectApiName} fields, merged across all assigned
                        permission sets and the profile
                    </p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner
                            alternative-text="Loading"
                            size="medium"
                        ></lightning-spinner>
                    </template>
                    <template if:true={errorMessage}>
                        <div
                            class="slds-notify slds-notify_alert slds-theme_error"
                            role="alert"
                        >
                            {errorMessage}
                        </div>
                    </template>
                    <template if:true={hasFields}>
                        <lightning-datatable
                            key-field="fieldApiName"
                            data={fields}
                            columns={columns}
                            hide-checkbox-column
                        ></lightning-datatable>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button
                        class="slds-button slds-button_brand"
                        onclick={handleClose}
                    >
                        Close
                    </button>
                </footer>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </section>
</template>
