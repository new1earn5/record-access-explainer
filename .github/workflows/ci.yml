name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-jest:
    name: Lint, format check, and LWC Jest tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (LWC)
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: LWC Jest tests
        run: npm run test:unit:coverage

      - name: Update coverage badges
        if: github.event_name == 'push'
        run: |
          npm run coverage:badges
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update coverage badges [skip ci]"
            git push
          fi

  apex-static-analysis:
    name: Salesforce Code Analyzer (Apex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer@latest

      # code-analyzer.yml disables only style/design rules this project has deliberately chosen
      # against elsewhere (see the file's own comments); every rule left enabled is a real,
      # currently-clean gate. High severity or above fails the build.
      - name: Run Code Analyzer against production and test Apex
        run: sf code-analyzer run --config-file code-analyzer.yml --workspace force-app/main/default/classes --rule-selector Recommended --severity-threshold High

  check-devhub-secret:
    name: Check for Dev Hub secret
    runs-on: ubuntu-latest
    outputs:
      has-devhub: ${{ steps.check.outputs.has-devhub }}
    steps:
      - id: check
        env:
          SFDX_AUTH_URL_DEVHUB: ${{ secrets.SFDX_AUTH_URL_DEVHUB }}
        # Job-level `if:` cannot reference the secrets context directly (GitHub Actions rejects
        # the whole workflow file with "Unrecognized named-value: 'secrets'" if it does), so the
        # presence check has to happen in a step here and get passed down via a job output.
        run: |
          if [ -n "$SFDX_AUTH_URL_DEVHUB" ]; then
            echo "has-devhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-devhub=false" >> "$GITHUB_OUTPUT"
          fi

  apex:
    name: Deploy to scratch org and run Apex tests
    runs-on: ubuntu-latest
    # Only runs once SFDX_AUTH_URL_DEVHUB is configured as a repository secret (see README §10
    # "Continuous Integration"). Until then this job is skipped rather than failing the workflow,
    # so lint-and-jest still gates pull requests on its own. Secrets are unavailable to
    # pull_request workflows from forks, so this also safely skips for external contributors.
    if: ${{ needs.check-devhub-secret.outputs.has-devhub == 'true' }}
    needs: [lint-and-jest, check-devhub-secret]
    steps:
      - uses: actions/checkout@v7

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Dev Hub
        env:
          SFDX_AUTH_URL_DEVHUB: ${{ secrets.SFDX_AUTH_URL_DEVHUB }}
        run: |
          echo "$SFDX_AUTH_URL_DEVHUB" > ./DEVHUB_SFDX_URL.txt
          sf org login sfdx-url --sfdx-url-file ./DEVHUB_SFDX_URL.txt --alias devhub --set-default-dev-hub
          rm ./DEVHUB_SFDX_URL.txt

      - name: Create scratch org
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ci-scratch --duration-days 1 --target-dev-hub devhub --wait 10

      - name: Deploy source
        run: sf project deploy start --source-dir force-app --target-org ci-scratch

      - name: Run Apex tests
        run: sf apex run test --target-org ci-scratch --test-level RunLocalTests --code-coverage --result-format human --wait 20

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt
